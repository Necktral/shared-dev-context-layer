name: phase3-ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  governance:
    name: governance-pr-metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR governance metadata
        run: ./scripts/validate_pr_governance.sh

  docs:
    name: docs-consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Contract closure (docs)
        run: ./scripts/run_contract_closure.sh docs

  vscode-extension:
    name: vscode-extension-compile-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Contract closure (extension)
        run: ./scripts/run_contract_closure.sh extension

  local-private:
    name: local-private-postgres-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wis_context
          POSTGRES_USER: wis_admin
          POSTGRES_PASSWORD: wis_strong_password_change_this
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wis_admin -d wis_context"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LOCAL_DB_TESTS: "1"
      LOCAL_DB_HOST: localhost
      LOCAL_DB_PORT: "5432"
      LOCAL_DB_NAME: wis_context
      LOCAL_DB_USER: wis_admin
      LOCAL_DB_PASSWORD: wis_strong_password_change_this
      POSTGRES_DB: wis_context
      POSTGRES_USER: wis_admin
      POSTGRES_PASSWORD: wis_strong_password_change_this
      POSTGRES_HOST_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Contract closure (local-db)
        run: ./scripts/run_contract_closure.sh local-db

  backend:
    name: backend-pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wis_context
          POSTGRES_USER: wis_admin
          POSTGRES_PASSWORD: wis_strong_password_change_this
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wis_admin -d wis_context"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECT_NAME: shared-dev-context-layer
      BACKEND_PORT: 8001
      MCP_PORT: 8002
      SYSTEM_MODE: delegated_limited
      DATABASE_URL: postgresql://wis_admin:wis_strong_password_change_this@localhost:5432/wis_context
      MCP_AUTH_ENABLED: "true"
      MCP_AUTH_BYPASS_LOCAL: "true"
      MCP_AUTH0_ISSUER: "https://necktral.us.auth0.com/"
      MCP_AUTH0_AUDIENCE: "https://wis-context-sync-read-api"
      MCP_AUTH0_JWKS_URL: "https://necktral.us.auth0.com/.well-known/jwks.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contract closure (backend)
        run: ./scripts/run_contract_closure.sh backend
