services:
  postgres:
    image: postgres:16
    container_name: wis_context_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - wis_context_postgres_data:/var/lib/postgresql/data
    ports:
      # WP-0.5: publicación loopback — nada del stack alcanzable desde la LAN por defecto.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wis_context_net

  # Servicio de un solo uso: aplica migraciones Alembic y siembra datos base.
  # backend y mcp esperan a que termine OK antes de arrancar.
  migrate:
    build:
      context: ./backend
    container_name: wis_context_migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed_v5"]
    restart: "no"
    networks:
      - wis_context_net

  backend:
    build:
      context: ./backend
    container_name: wis_context_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8001"
    networks:
      - wis_context_net

  mcp:
    build:
      context: ./backend
    container_name: wis_context_mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # WP-0.5: dentro del contenedor bindea 0.0.0.0 (necesario para la red del compose
      # y el port-forwarding); el perímetro real es la publicación loopback de abajo.
      MCP_BIND_HOST: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.mcp.server"]
    ports:
      - "127.0.0.1:${MCP_PORT}:8002"
    networks:
      - wis_context_net

volumes:
  wis_context_postgres_data:

networks:
  wis_context_net:
    driver: bridge
